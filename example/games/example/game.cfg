# A stand-in for a game: the settings the toolkit reads for one (Makefile, tools and launcher, through
# tools/gamecfg.py). There is no such disc; a real game's values come from its own disc's header.

name = Example Game
id = example
app_id = io.github.tmcleroy.satrecomp.example
# the disc a port is made from: product number and version from the disc header
# (the first 256 bytes of the data track), and the name shown by the launcher
disc_name = Example Game (no such disc)
disc_product = XX-00000
disc_version = V1.000
disclaimer = A stand-in with no game.
# The GitHub repository (owner/name) whose releases the launcher updates itself from, with the game
# repository's VERSION as its version: each release then carries an update-<system>.txt beside each
# download (recomp-common/launcher/src/update.h). Empty: the launcher does not look for updates.
update_repo =

# Sync points (hex addresses, separated by spaces): where a CPU, when free running, pauses so that the
# other one gets time. A game that needs none leaves this empty.
sync_points =
